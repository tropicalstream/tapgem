<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRC</title><!-- keeps its own state through TapGemIrc; not instrumented (window.__tgReg) -->
<style>
/* Themes after cool-retro-term's profiles. On a waveguide black is transparent, so every theme keeps a
   near-black ground and puts its character into the phosphor colour, glow and scan pattern. */
:root{--fg:#ffb000;--dim:#8a5e00;--bright:#ffd36b;--bg:#050300;--glow:0 0 6px rgba(255,176,0,.55);--font:"Menlo","DejaVu Sans Mono","Courier New",monospace;--scan:0;--px:0;--curve:0}
[data-theme=green]{--fg:#33ff33;--dim:#1c8a1c;--bright:#b6ffb6;--bg:#000500;--glow:0 0 6px rgba(51,255,51,.5)}
[data-theme=scanlines]{--fg:#3cff6c;--dim:#1f8a3c;--bright:#c9ffd6;--bg:#000400;--glow:0 0 7px rgba(60,255,108,.6);--scan:1}
[data-theme=pixel]{--fg:#ffffff;--dim:#8f8f8f;--bright:#ffffff;--bg:#000;--glow:none;--px:1;--font:"Courier New",monospace}
[data-theme=apple2]{--fg:#25f74d;--dim:#137a29;--bright:#d2ffd8;--bg:#000;--glow:0 0 5px rgba(37,247,77,.5);--scan:1;--px:1}
[data-theme=vintage]{--fg:#ffcf7a;--dim:#9c7a3c;--bright:#fff1cf;--bg:#0a0602;--glow:0 0 9px rgba(255,207,122,.6);--scan:1;--curve:1}
[data-theme=dos]{--fg:#e0e0e0;--dim:#8fa0ff;--bright:#ffffff;--bg:#00007a;--glow:none;--font:"Courier New",monospace}
[data-theme=ibm3278]{--fg:#4af0e0;--dim:#207a72;--bright:#d5fffb;--bg:#000;--glow:0 0 6px rgba(74,240,224,.5)}
[data-theme=futuristic]{--fg:#7fd7ff;--dim:#2f6a8a;--bright:#e6f8ff;--bg:#020409;--glow:0 0 8px rgba(127,215,255,.6);--scan:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;overflow:hidden;text-shadow:var(--glow)}
body{display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--dim);flex:none;white-space:nowrap;overflow:hidden}
#top .net{color:var(--bright);font-weight:bold}
#top .nick{margin-left:auto;color:var(--dim)}
#top .st{color:var(--dim);font-size:12px}
#tabs{display:flex;gap:4px;padding:4px 6px;border-bottom:1px solid var(--dim);flex:none;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:3px 10px;border:1px solid var(--dim);border-radius:3px;color:var(--dim);cursor:pointer;flex:none;font-size:14px}
.tab.on{color:var(--bg);background:var(--fg);border-color:var(--fg);text-shadow:none}
.tab.hot{color:var(--bright);border-color:var(--bright)}
#log{flex:1;overflow-y:auto;padding:6px 8px;scrollbar-width:thin}
.l{margin:0 0 3px;word-break:break-word}
.l .t{color:var(--dim);margin-right:6px;font-size:12px}
.l .n{color:var(--bright);margin-right:6px}
.l.own .n{color:var(--fg)}
.l.own{opacity:.9}
.l.status,.l.info,.l.motd,.l.join,.l.part,.l.topic{color:var(--dim)}
.l.error{color:var(--bright);font-weight:bold}
.l.highlight .x{color:var(--bright);font-weight:bold}
.l.action .x{font-style:italic}
#bottom{flex:none;border-top:1px solid var(--dim);padding:5px 8px;display:flex;gap:6px;align-items:center}
#in{flex:1;background:transparent;border:1px solid var(--dim);color:var(--fg);font:inherit;padding:4px 6px;outline:none;text-shadow:inherit}
#in:focus{border-color:var(--fg)}
.btn{border:1px solid var(--dim);color:var(--fg);padding:4px 10px;cursor:pointer;flex:none;font-size:14px;background:transparent}
.btn:active{background:var(--fg);color:var(--bg);text-shadow:none}
#pending{display:none;flex:none;border-top:1px solid var(--fg);padding:6px 8px;background:rgba(0,0,0,.35)}
#pending.on{display:block}
#pending .q{color:var(--bright)}
#pending .row{display:flex;gap:8px;margin-top:5px}
#menu{display:none;position:absolute;left:0;top:0;right:0;bottom:0;background:var(--bg);padding:10px;overflow:auto;z-index:5}
#menu.on{display:block}
#menu h3{margin:6px 0 4px;color:var(--bright);font-size:14px;font-weight:normal;letter-spacing:.1em}
#menu .grid{display:flex;flex-wrap:wrap;gap:6px}
#menu .grid .btn{min-width:88px;text-align:center}
#menu input{background:transparent;border:1px solid var(--dim);color:var(--fg);font:inherit;padding:4px 6px;width:170px}
#menu .close{position:absolute;right:10px;top:8px}
#fx{pointer-events:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:4}
[data-theme=scanlines] #fx,[data-theme=apple2] #fx,[data-theme=vintage] #fx,[data-theme=futuristic] #fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
[data-theme=vintage] #fx{box-shadow:inset 0 0 60px rgba(0,0,0,.7)}
[data-theme=pixel] body,[data-theme=apple2] body{font-family:"Courier New",monospace;letter-spacing:.04em}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{to{opacity:0}}
</style></head>
<body data-theme="amber">
<div id="top"><span class="net" id="net">IRC</span><span class="st" id="st">offline</span><span class="nick" id="nick">gomie_</span><button class="btn" id="menubtn" style="font-size:12px;padding:2px 8px">menu</button></div>
<div id="tabs"></div>
<div id="log"></div>
<div id="pending"><div class="q">Send to <b id="pt"></b>: <span id="px"></span> ?</div><div class="row"><button class="btn" id="pyes">send</button><button class="btn" id="pno">cancel</button></div></div>
<div id="bottom"><input id="in" placeholder="say something… or /join #chan · /nick x · /msg who text" autocomplete="off"><button class="btn" id="send">send</button></div>
<div id="fx"></div>
<div id="menu"><button class="btn close" id="mclose">×</button>
  <h3>NETWORK</h3><div class="grid" id="servers"></div>
  <h3>NICK</h3><div class="grid"><input id="mnick" value="gomie_"><button class="btn" id="mnickset">set</button></div>
  <h3>CHANNEL</h3><div class="grid"><input id="mchan" placeholder="#channel"><button class="btn" id="mjoin">join</button><button class="btn" id="mpart">leave current</button></div>
  <h3>THEME</h3><div class="grid" id="themes"></div>
  <h3>SESSION</h3><div class="grid"><button class="btn" id="mdisc">disconnect</button></div>
</div>
<script>
(function(){
var THEMES=['amber','green','scanlines','pixel','apple2','vintage','dos','ibm3278','futuristic'];
var S={status:'offline',nick:'gomie_',current:'*',targets:[],servers:[],lines:{},seq:0,unread:{},theme:'amber'};
var $=function(i){return document.getElementById(i)};
var bridge=window.TapGemIrc||null, tg=window.TapGem||null;
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function tm(t){var d=new Date(t);return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function cmd(o){try{return bridge?bridge.cmd(JSON.stringify(o)):'no bridge'}catch(e){return String(e)}}
function setTheme(t){if(THEMES.indexOf(t)<0)return;S.theme=t;document.body.setAttribute('data-theme',t);try{tg&&tg.save('theme',t)}catch(e){}renderThemes()}
function push(l){(S.lines[l.target]=S.lines[l.target]||[]).push(l);if(S.lines[l.target].length>400)S.lines[l.target].shift();if(l.seq>S.seq)S.seq=l.seq;
  if(l.target!==S.current&&(l.kind==='msg'||l.kind==='highlight'||l.kind==='action'||l.kind==='notice'))S.unread[l.target]=l.kind==='highlight'?2:Math.max(1,S.unread[l.target]||0);
  if(S.targets.map(function(x){return x.name}).indexOf(l.target)<0&&l.target!=='*')S.targets.push({name:l.target,members:0,topic:''});
  if(l.target===S.current)appendLine(l,true)}
function appendLine(l,scroll){var log=$('log'),atEnd=log.scrollTop+log.clientHeight>=log.scrollHeight-24;
  var d=document.createElement('div');d.className='l '+l.kind;
  var body=l.kind==='msg'||l.kind==='own'||l.kind==='highlight'||l.kind==='notice'?'<span class="n">'+(l.kind==='notice'?'-':'&lt;')+esc(l.from)+(l.kind==='notice'?'-':'&gt;')+'</span><span class="x">'+esc(l.text)+'</span>'
    :l.kind==='action'?'<span class="x">* '+esc(l.from)+' '+esc(l.text)+'</span>'
    :l.kind==='join'||l.kind==='part'?'<span class="x">→ '+esc(l.from)+' '+esc(l.text)+'</span>'
    :l.kind==='topic'?'<span class="x">topic: '+esc(l.text)+'</span>':'<span class="x">'+esc(l.text)+'</span>';
  d.innerHTML='<span class="t">'+tm(l.t)+'</span>'+body;log.appendChild(d);
  while(log.childNodes.length>400)log.removeChild(log.firstChild);
  if(scroll&&atEnd)log.scrollTop=log.scrollHeight}
function renderLog(){var log=$('log');log.innerHTML='';(S.lines[S.current]||[]).forEach(function(l){appendLine(l,false)});log.scrollTop=log.scrollHeight}
function renderTabs(){var t=$('tabs');t.innerHTML='';var all=[{name:'*'}].concat(S.targets.filter(function(x){return x.name!=='*'}));
  all.forEach(function(x){var b=document.createElement('div');b.className='tab'+(x.name===S.current?' on':'')+(S.unread[x.name]?' hot':'');
    b.textContent=(x.name==='*'?'server':x.name)+(S.unread[x.name]===2?' !':'');b.onclick=function(){switchTo(x.name)};t.appendChild(b)})}
function renderTop(){var srv=S.server;$('net').textContent=srv?srv.label:'IRC';$('st').textContent=S.status==='registered'?'● online':S.status==='connecting'?'○ connecting…':'○ offline';$('nick').textContent=S.nick;
  var cur=S.targets.filter(function(x){return x.name===S.current})[0];if(cur&&cur.topic)$('st').textContent+=' · '+cur.topic.slice(0,60)}
function renderThemes(){var g=$('themes');g.innerHTML='';THEMES.forEach(function(t){var b=document.createElement('button');b.className='btn';b.textContent=(t===S.theme?'▶ ':'')+t;b.onclick=function(){setTheme(t)};g.appendChild(b)})}
function renderServers(){var g=$('servers');g.innerHTML='';S.servers.forEach(function(s){var b=document.createElement('button');b.className='btn';b.textContent=(S.server&&S.server.key===s.key&&S.status!=='offline'?'▶ ':'')+s.label;b.onclick=function(){cmd({op:'connect',server:s.key,nick:$('mnick').value});$('menu').classList.remove('on')};g.appendChild(b)})}
function renderPending(){var p=S.pending;$('pending').classList.toggle('on',!!p);if(p){$('pt').textContent=p.target;$('px').textContent=p.text}}
function switchTo(t){S.current=t;S.unread[t]=0;cmd({op:'current',target:t});renderTabs();renderTop();renderLog()}
function load(){if(!bridge)return;var snap;try{snap=JSON.parse(bridge.snapshot(String(S.seq)))}catch(e){return}
  S.status=snap.status;S.nick=snap.nick;S.server=snap.server;S.servers=snap.servers||[];S.targets=snap.targets||[];S.pending=snap.pending;
  var cur=snap.current||'*';if(cur!==S.current){S.current=cur}
  (snap.lines||[]).forEach(function(l){if(l.seq>S.seq){(S.lines[l.target]=S.lines[l.target]||[]).push(l);S.seq=Math.max(S.seq,l.seq)}});
  renderTop();renderTabs();renderLog();renderServers();renderPending()}
window.__ircEvent=function(js){var o;try{o=JSON.parse(js)}catch(e){return}
  if(o.type==='line'){push(o.line);renderTabs()}
  else if(o.type==='status'){S.status=o.status;if(o.nick)S.nick=o.nick;load()}
  else if(o.type==='joined'){S.current=o.target;S.unread[o.target]=0;load()}
  else if(o.type==='parted'){delete S.lines[o.target];load()}
  else if(o.type==='nick'){S.nick=o.nick;renderTop()}
  else if(o.type==='current'){if(o.target!==S.current){S.current=o.target;S.unread[o.target]=0;renderTabs();renderTop();renderLog()}}
  else if(o.type==='names'){load()}
  else if(o.type==='theme'){setTheme(o.name)}
  else if(o.type==='error'){push({seq:S.seq,t:Date.now(),target:S.current,kind:'error',from:'',text:o.text})}
  S.pending=null;try{var sn=JSON.parse(bridge.snapshot('999999999'));S.pending=sn.pending}catch(e){}renderPending()};
function submit(){var v=$('in').value.trim();if(!v)return;$('in').value='';
  if(v[0]==='/'){var sp=v.indexOf(' '),c=(sp<0?v.slice(1):v.slice(1,sp)).toLowerCase(),rest=sp<0?'':v.slice(sp+1).trim();
    if(c==='join'||c==='j')cmd({op:'join',channel:rest});else if(c==='part'||c==='leave')cmd({op:'part',channel:rest||S.current});
    else if(c==='nick')cmd({op:'nick',nick:rest});else if(c==='msg'){var w=rest.indexOf(' ');cmd({op:'say',target:rest.slice(0,w),text:rest.slice(w+1)})}
    else if(c==='me')cmd({op:'say',target:S.current,text:'/me '+rest});else if(c==='connect'||c==='server')cmd({op:'connect',server:rest,nick:S.nick});
    else if(c==='quit'||c==='disconnect')cmd({op:'disconnect'});else if(c==='theme')setTheme(rest);else if(c==='quote'||c==='raw')cmd({op:'raw',line:rest});
    else push({seq:S.seq,t:Date.now(),target:S.current,kind:'error',from:'',text:'unknown command /'+c});return}
  var r=cmd({op:'say',target:S.current,text:v});if(r!=='ok')push({seq:S.seq,t:Date.now(),target:S.current,kind:'error',from:'',text:r==='not connected'?'not connected — pick a network in the menu':r})}
$('send').onclick=submit;$('in').addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
$('menubtn').onclick=function(){$('mnick').value=S.nick;renderServers();renderThemes();$('menu').classList.add('on')};
$('mclose').onclick=function(){$('menu').classList.remove('on')};
$('mnickset').onclick=function(){cmd({op:'nick',nick:$('mnick').value})};
$('mjoin').onclick=function(){var c=$('mchan').value.trim();if(c){cmd({op:'join',channel:c});$('mchan').value='';$('menu').classList.remove('on')}};
$('mpart').onclick=function(){if(S.current!=='*')cmd({op:'part',channel:S.current});$('menu').classList.remove('on')};
$('mdisc').onclick=function(){cmd({op:'disconnect'});$('menu').classList.remove('on')};
$('pyes').onclick=function(){cmd({op:'confirm'});S.pending=null;renderPending()};
$('pno').onclick=function(){cmd({op:'cancel'});S.pending=null;renderPending()};
var saved='';try{saved=tg?tg.load('theme'):''}catch(e){}
setTheme(saved||'amber');renderThemes();
if(!bridge){$('log').innerHTML='<div class="l error">TapGemIrc bridge missing — this page only works inside a TapGem window.</div>'}
load();
if(bridge&&S.status==='offline'){push({seq:S.seq,t:Date.now(),target:'*',kind:'status',from:'',text:'Say "connect to Libera" (or EFnet / OCF), or open the menu ↗'});renderLog()}
setInterval(function(){if(bridge){try{var sn=JSON.parse(bridge.snapshot(String(S.seq)));if(sn.status!==S.status||sn.nick!==S.nick||(sn.lines&&sn.lines.length))load();else{S.pending=sn.pending;renderPending()}}catch(e){}}},2500);
})();
</script>
</body></html>
