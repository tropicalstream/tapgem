<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TapGem 3D</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; }
  #msg { position:fixed; left:0; right:0; bottom:6px; text-align:center; color:#9fe6b0;
         font:12px sans-serif; opacity:.85; pointer-events:none; }
</style>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/OBJLoader.js"></script>
<script src="vendor/OrbitControls.js"></script>
</head>
<body>
<div id="msg">loading…</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get('src') || '';
  var spin = q.get('spin') !== '0';
  var msg = document.getElementById('msg');

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
  var key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(3, 5, 4); scene.add(key);
  var fill = new THREE.DirectionalLight(0x88aaff, 0.5); fill.position.set(-4, 2, -3); scene.add(fill);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.autoRotate = spin; controls.autoRotateSpeed = 1.6;

  function frame(obj) {
    var box = new THREE.Box3().setFromObject(obj);
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    var dist = maxDim / (2 * Math.tan((camera.fov * Math.PI / 180) / 2)) * 1.35;
    camera.position.set(dist * 0.6, dist * 0.35, dist);
    camera.near = dist / 100; camera.far = dist * 100; camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0); controls.update();
  }

  function ok(obj) { scene.add(obj); frame(obj); msg.textContent = ''; }
  function fail(e) { msg.textContent = 'could not load model'; console.error(e); }

  var lower = src.toLowerCase().split('?')[0];
  if (!src) { msg.textContent = 'no model'; }
  else if (/\.obj$/.test(lower)) {
    new THREE.OBJLoader().load(src, function (o) {
      o.traverse(function (c) { if (c.isMesh && !c.material) c.material = new THREE.MeshStandardMaterial({ color: 0x9fb8ff }); });
      ok(o);
    }, undefined, fail);
  } else {
    new THREE.GLTFLoader().load(src, function (g) { ok(g.scene); }, undefined, fail);
  }

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
